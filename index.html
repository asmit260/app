<!DOCTYPE html>
<html lang="en" class="light" style="background-color: #F4EFE6;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6">
  <title>AniTrack — Anime Companion App</title>
  <meta name="description" content="Your ultimate anime schedule, watchlist manager, and AI anime advisor.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">

    /* Critical First-Paint Instant Styles */
    html, body {
      background-color: #F4EFE6;
      color: #18130D;

      height: 100%;
      width: 100%;

      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .initial-preload {
      display: flex;
      flex-direction: column;

      justify-content: center;
      min-height: 100vh;
      background-color: #F4EFE6;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>

<body class="bg-sand-100 text-ink-900 font-sans antialiased select-none overflow-x-hidden selection:bg-amber-400 selection:text-ink-900" style="background-color: #F4EFE6;">
  <div id="root">
    <div class="initial-preload">
      <div style="font-weight: 900; font-size: 24px; text-transform: uppercase; background: #D4974A; color: #18130D; padding: 6px 18px; border: 2.5px solid #18130D; box-shadow: 4px 4px 0px #18130D; transform: rotate(-1deg); margin-bottom: 12px;">
        AniTrack
      </div>
      <div style="font-size: 11px; font-weight: 700; color: #6E5E4E; letter-spacing: 0.5px;">
        Loading Scout Database...
      </div>
